<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Frame with transparent rounded rect cutout in middle -->
  <path fill="url(#primaryGrad)" fill-rule="evenodd" d="
    M 0 0
    H 1000
    V 1000
    H 0
    Z
    M 120 120
    H 880
    V 880
    H 120
    Z
  "/>

  <!-- Inner border ring -->
  <rect x="114" y="114" width="772" height="772" rx="4" fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.9" />
  <rect x="94" y="94" width="812" height="812" fill="none" stroke="#FDE047" stroke-width="4" stroke-dasharray="16 12" />

  <!-- Confetti / Stars floating -->
  <g fill="#FDE047">
    <polygon points="50,60 55,75 70,75 58,85 62,100 50,90 38,100 42,85 30,75 45,75" />
    <polygon points="950,60 955,75 970,75 958,85 962,100 950,90 938,100 942,85 930,75 945,75" />
    <circle cx="200" cy="50" r="10" fill="#EC4899" />
    <circle cx="800" cy="50" r="10" fill="#38BDF8" />
    <circle cx="60" cy="500" r="12" fill="#FBBF24" />
    <circle cx="940" cy="500" r="12" fill="#34D399" />
  </g>

  <!-- Top Headline Banner -->
  <g filter="url(#softShadow)">
    <rect x="250" y="35" width="500" height="60" rx="30" fill="#FFFFFF" />
    <text x="500" y="76" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#4F46E5" text-anchor="middle">
      ✨ يـوم الـتـخـرج والـنـجـاح ✨
    </text>
  </g>

  <!-- Bottom Congrats Ribbon -->
  <g filter="url(#softShadow)">
    <rect x="220" y="895" width="560" height="75" rx="37" fill="url(#accentGrad)" />
    <text x="500" y="943" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">
      🎓 مـبـارك هـذا الإنـجـاز الـعـظـيـم 🎓
    </text>
  </g>
</svg>
